<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">SkillMatch Web</title>

  <defs>
    <linearGradient id="azulClaro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#4A9FD8"/>
    </linearGradient>
    <filter id="sombraEscura" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#14181d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ícone: lupa com abertura, pessoas dentro, code brackets e pontos saindo da abertura -->
  <g transform="translate(6,6)">

    <!-- cabo da lupa (verde) -->
    <line x1="80" y1="80" x2="102" y2="102" stroke="#27ae60" stroke-width="13"
          stroke-linecap="round" filter="url(#sombraEscura)"/>

    <!-- aro da lupa (azul claro), com abertura no canto superior direito -->
    <circle cx="52" cy="52" r="40" fill="none" stroke="url(#azulClaro)" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="205 46.3" transform="rotate(0 52 52)"/>

    <!-- code brackets, saindo exatamente pela abertura do aro -->
    <text x="99" y="29" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
          fill="#27ae60" text-anchor="middle">&lt;/&gt;</text>

    <!-- pessoa da esquerda (azul claro) -->
    <circle cx="34" cy="46" r="6.5" fill="url(#azulClaro)"/>
    <path d="M22 68 C22 58 26 54 34 54 C42 54 46 58 46 68 Z" fill="url(#azulClaro)"/>

    <!-- pessoa da direita (azul claro) -->
    <circle cx="70" cy="46" r="6.5" fill="url(#azulClaro)"/>
    <path d="M58 68 C58 58 62 54 70 54 C78 54 82 58 82 68 Z" fill="url(#azulClaro)"/>

    <!-- pessoa central em destaque (verde) -->
    <circle cx="52" cy="42" r="8" fill="#27ae60"/>
    <path d="M37 70 C37 58 43 52 52 52 C61 52 67 58 67 70 Z" fill="#27ae60"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="url(#azulClaro)">Skill<tspan fill="#27ae60">Match</tspan></text>

  <!-- Tagline com tracinhos verdes -->
  <line x1="130" y1="82" x2="150" y2="82" stroke="#27ae60" stroke-width="2"/>
  <text x="158" y="86" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#ffffff">CONECTANDO TALENTOS E VAGAS</text>
</svg>
